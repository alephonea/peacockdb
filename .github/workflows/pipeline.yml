name: CI Pipeline

# Documentation-only changes skip the whole pipeline. Nothing under llm-wiki/ or any
# .md file is read by a build, a test or a golden — verified by grep, and the rule is
# only safe while that stays true, so a doc file that ever becomes an input (a fixture,
# a generated table someone asserts on) has to come off this list.
#
# paths-ignore skips only when EVERY changed file matches, so a commit touching the spec
# and the code it describes still runs in full. No status check is required on master
# (no ruleset enforcement, no required_status_checks), so a skipped run leaves a PR
# mergeable rather than stuck waiting on a check that will never report.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'llm-wiki/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'llm-wiki/**'

jobs:
  # paths-ignore above is not enough on its own. For a pull_request event GitHub
  # evaluates it against the WHOLE PR diff, not the commits just pushed, so a PR that
  # touches any code runs the full pipeline on every later docs-only push — measured,
  # not assumed: a docs-only push to #118 started run 31644108948 with the filter live.
  # This job closes that case by classifying the push range itself.
  #
  # Fail-open by construction. It answers `code=true` — run everything — for any event
  # that is not a synchronize, a force push or rebase, an unreadable compare, a range at
  # the API's page limit, and any file it cannot place. Only a clean append of
  # documentation skips. A wrong skip is also not a hole into master: the merge lands as
  # a push whose own diff carries the code, and that run re-evaluates from scratch.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Is this push documentation-only?
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # Every exit but the last one is "run the pipeline", and each says why, so a
          # skip is never silent and neither is a fallback.
          everything() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "running in full: $1"; exit 0; }

          [ "$EVENT" = pull_request ] && [ "$ACTION" = synchronize ] \
            || everything "${EVENT}/${ACTION:-none} is not a pull-request push"
          [ -n "$BEFORE" ] && [ -n "$AFTER" ] || everything "the payload carries no before/after"

          # The compare API rather than a checkout: no fetch-depth guessing about whether
          # $BEFORE is still reachable, and a force push is reported rather than inferred.
          cmp=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER") \
            || everything "could not compare $BEFORE...$AFTER"
          status=$(jq -r '.status' <<<"$cmp")
          [ "$status" = ahead ] \
            || everything "the new head is '$status' of the old one, not a clean append"
          count=$(jq -r '(.files // []) | length' <<<"$cmp")
          [ "$count" -lt 300 ] || everything "$count files — at the compare endpoint's page limit"

          files=$(jq -r '(.files // [])[].filename' <<<"$cmp")
          echo "changed in this push:"; echo "${files:-(nothing)}" | sed 's/^/  /'
          # Same two patterns as paths-ignore above; they must stay in step.
          if grep -qvE '(\.md$|^llm-wiki/)' <<<"$files"; then
            everything "the push changes more than documentation"
          fi
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "documentation only — skipping the pipeline for this push"

  # What this tier OFFERS: the generated sf1 dataset and the cuDF matrix. `cost-report` has
  # neither, which is what the two names distinguish.
  # What LANDS here is a different question, and the answer is production code — the engine's
  # tests belong together whether or not each one needs the dataset, and `cost-report` holds
  # the report crate and its inputs. Several steps below need nothing this tier offers and
  # are here for that rule rather than in spite of it.
  dataset-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cudf: "26.02"
            image: rapidsai/base:25.10a-cuda12-py3.12
          - cudf: "25.02"
            image: rapidsai/base:25.02-cuda12.0-py3.12
    name: CI Pipeline (cudf ${{ matrix.cudf }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    # Inside a container the runner does NOT default `run:` to bash — it resolved to
    # `sh -e {0}` in these rapids images, so a step opening with `set -euo pipefail`
    # died on "Illegal option -o pipefail" before running anything. Declared at the job
    # so the next step added here cannot rediscover it; the composite action already
    # says `shell: bash` on every step, which is how bash is known to be present.
    defaults:
      run:
        shell: bash

    # Job level, not per step: every cargo invocation here needs both, and a step-level
    # copy is a thing the next step added to this job can omit. The seven rust-only steps
    # below arrived without one and the leg went red — flatc-fork's build script runs
    # cmake, this image has ninja and no make, and a RUSTFLAGS that differs from the
    # cached one recompiles the whole DataFusion stack, since it is part of every cargo
    # fingerprint. Same argument as `defaults.run.shell` above.
    env:
      CMAKE_GENERATOR: Ninja
      # Strip debug info from all Rust artifacts. The test binaries link the full
      # DataFusion/Arrow stack plus libpeacock_gpu; with debuginfo the largest one
      # (test_query_plan, with the TPC-DS suite merged in) overflows the container's
      # tmpfs while lld writes its mmap'd output, crashing with SIGBUS. Debug info is
      # dead weight for pass/fail CI.
      RUSTFLAGS: "-C debuginfo=0"

    steps:
      - name: Install git
        if: matrix.cudf == '25.02'
        run: conda install -y -n base -c conda-forge git curl

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/cpp-build
        with:
          cudf: ${{ matrix.cudf }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache ~/.cargo + target/ so the opt-level-3 DataFusion/Arrow dep tree
      # compiles once and restores on warm runs. The key is PER cudf matrix leg
      # (25.02/26.02) — they must NOT share one cache. target/ holds flatc-fork's
      # compiled `flatc` host binary, which dynamically links the build container's
      # glibc; the two cudf images ship different glibc, so a flatc built on the
      # 26.02 image (GLIBC_2.38) fails to run on the older-glibc 25.02 image
      # ("GLIBC_2.38 not found" -> build.rs flatc panic). A shared key let 26.02
      # poison 25.02's cache. The job's RUSTFLAGS (-C debuginfo=0) is what every cargo
      # step here builds with, so restored artifacts fingerprint-match.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cudf-${{ matrix.cudf }}

      - name: Run CPU tests (CPP)
        run: ctest --test-dir cpp/build -L cpu --output-on-failure

      - name: Generate SF-1 test data
        run: |
          # Pinned: the TPC-DS dsdgen extension's column types drift across
          # DuckDB releases (e.g. INT32 vs INT64 surrogate keys), which would
          # shift row_width and target_batch_size across every plan golden.
          # generate_testdata.sh asserts $(duckdb --version) matches this.
          #
          # Use the official GitHub RELEASE binary (v1.5.4, build 08e34c447b) — the
          # SAME build the committed goldens are generated with on local/verda, so CI's
          # regenerated parquet is byte-identical. (conda-forge's duckdb-cli=1.5.4 was
          # repackaged against icu 78, which conflicts with the base env's mamba pinned
          # to icu 75 -> LibMambaUnsatisfiableError; and a different build risks
          # different parquet bytes vs the goldens.)
          # Retried for the same reason the cmake/ninja fetch is: the releases CDN
          # answers 503 often enough to be the single most common cause of a red run.
          # No --retry-delay — curl's default doubling rides out a longer outage than any
          # fixed delay, and --retry-max-time bounds the total.
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 \
            https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/duckdb.zip').extractall('/tmp/duckdb-bin')"
          chmod +x /tmp/duckdb-bin/duckdb
          export DUCKDB=/tmp/duckdb-bin/duckdb
          "$DUCKDB" --version
          testdata/generate_testdata.sh --bench tpch
          testdata/generate_testdata.sh --bench tpcds

      # Tier A: structural validation of the freshly generated sf1 data. Runs in the
      # rapids container (matrix leg). CI generates SYNTHETIC embeddings (no fetch), so
      # the DEEP/GloVe embedding checks auto-skip on FLOAT[8]; the row-count / schema /
      # sort-order / clustering checks always run. numpy+pyarrow ship in the rapids base
      # image (cudf depends on pyarrow), but self-heal if a future image drops them
      # rather than letting the validator fail to import.
      # The exec-model prototype's TPC-H plan shapes, which need the sf1 tables generated
      # above — the rest of that suite runs in the cost-report tier, which has no
      # dataset. One matrix leg only: the two legs differ in cuDF, which this pure-python
      # test cannot see, and a second run would only report the same failure twice.
      # The corpus queries are minutes rather than seconds: they live in
      # test_tpch_corpus.py and run in exec-model-corpus.yml on manual dispatch, so this
      # file has none left to exclude.
      - name: Exec-model TPC-H plans (Python)
        if: matrix.cudf == '25.02'
        run: |
          set -euo pipefail
          python3 -c "import pandas, pyarrow" 2>/dev/null || pip install --quiet pandas pyarrow
          python3 scripts/exec_model/tests/test_tpch.py

      # The rust tests that read committed artifacts rather than a device: the three
      # planner targets write their own parquet, the rest read goldens. They ran in the
      # cost-report tier until that tier was named for what it contains rather than for
      # what decides placement — they are prod-code tests and this is where prod-code
      # tests live. ONE matrix leg, for the reason the exec-model step above gives: a
      # rust-only test cannot see cuDF, so a second leg would report the same failure twice.
      # The three planner targets run first: each writes its own parquet, so none needs the
      # generated dataset, and a break in the mode under development shows in under a second.
      - name: Planner join capability (Rust)
        if: matrix.cudf == '25.02'
        run: cargo test --features rust-only -p peacockdb-core --test test_planner_join_capability

      # Every shape the planner refuses, reached from the SQL that provokes it: each
      # asserts its ticket number is in the message a user sees, so a refusal that stops
      # naming its ticket fails. Same self-written parquet as the step above.
      - name: Planner join refusals (Rust)
        if: matrix.cudf == '25.02'
        run: cargo test --features rust-only -p peacockdb-core --test test_planner_join_refusals

      # Every rule in the null analysis, on hand-built nodes: a source can declare a
      # NOT-nullable column here, which no corpus fixture can — every column in both
      # benchmarks is declared nullable, primary keys included.
      - name: Null analysis rules (Rust)
        if: matrix.cudf == '25.02'
        run: cargo test --features rust-only -p peacockdb-core --test test_null_analysis

      # Verify every committed .cost.txt exactly matches regeneration from its
      # sibling .cpu.txt plan golden (full-file, not just the total), and the
      # cost-model unit test. Pure text over committed goldens — no executor, no
      # dataset, no GPU.
      - name: Cost goldens match plan-golden regeneration (Rust)
        if: matrix.cudf == '25.02'
        run: cargo test --features rust-only -p peacockdb-core --test test_cost_model

      # The one reader of the golden text format, against strings rather than files:
      # no dataset, no executor — it belongs beside the cost model.
      # Every other golden assertion in the tree is a comparison through it.
      - name: The golden text format, read back (Rust)
        if: matrix.cudf == '25.02'
        run: cargo test --features rust-only -p peacockdb-core --test test_golden_format

      # The corpus goldens against their own arithmetic — conservation, lane counts,
      # the loader prefix, the root against the result. Committed files only, so it
      # needs no dataset of its own.
      - name: Corpus goldens against their own redundancy (Rust)
        if: matrix.cudf == '25.02'
        run: cargo test --features rust-only -p peacockdb-core --test test_corpus_goldens

      # The injection mechanism against itself: the plan rebuild is identity per arm
      # and per field, and the selector's output is a cover rather than a prefix.
      # Reads no parquet — the plans are hand-built and the four cases are the ones
      # that need no dataset.
      - name: Layout injection mechanism (Rust)
        if: matrix.cudf == '25.02'
        run: cargo test --features rust-only -p peacockdb-core --test test_batch_partitioned_injection


      - name: Validate sf1 datasets
        run: |
          python3 -c "import numpy, pyarrow" 2>/dev/null \
            || pip install --quiet numpy pyarrow
          python3 scripts/validate_tpch.py --sf 1
          python3 scripts/validate_tpcds.py --sf 1

      # Build and run are split into two steps so a compile failure is visibly
      # distinct from a test failure, and build vs run time is legible (the
      # opt-level bump made the build phase much heavier). The two steps MUST
      # share a byte-identical env: cargo's fingerprint includes RUSTFLAGS, so any
      # drift would make the run step silently recompile, defeating the split. That is
      # now structural for RUSTFLAGS and CMAKE_GENERATOR, which come from the job.
      - name: Build Rust tests
        run: |
          # EVERY target the run step invokes must be listed here, or its compile
          # failure surfaces as a run-step failure and the split stops meaning
          # anything. The five after test_cpu_full_table were run-only for exactly
          # that reason -- they compiled inside the "pure run" step.
          cargo test --no-run -p peacockdb-core --test test_plan_serialiser --test test_query_plan --test test_cpu_full_table \
            --test test_cpu_executor_misc --test test_cpu_oom --test test_node_executor \
            --test test_query_plan_misc --test test_cpu_partitioned \
            --test test_batch_partitioned_plans --test test_gpu_batch
          cargo test --no-run -p peacockdb-ffi --test test_ffi
          # Separate line because of --features rust-only: cargo's fingerprint
          # includes the feature set, so this cannot share the invocation above.
          # The feature only reaches peacockdb-ffi/peacockdb-core, not the
          # DataFusion/Arrow graph, so the extra compile is small.
          #
          # --lib rides HERE rather than on the default-feature line: the lib unit
          # tests touch no FFI — config, gpu_rule, resident, and the batch_partitioned
          # planner, which is most of them now — so under rust-only their
          # binary does not link libpeacock_gpu — a smaller link in the tier that has
          # already hit tmpfs/SIGBUS at link time. It shares this line's already-built
          # rust-only fingerprint, so it costs no extra dependency compile.
          cargo test --no-run --features rust-only -p peacockdb-core --lib --test test_plan_bytes \
            --test test_cpu_executors --test test_cpu_batch_partitioned
        env:
          # The pair's own two only; CMAKE_GENERATOR and RUSTFLAGS come from the job.
          LD_LIBRARY_PATH: /opt/conda/lib
          CUDF_ROOT: /opt/conda

      # Pure run: the targets were already compiled by "Build Rust tests" above
      # with the identical env below, so cargo finds matching fingerprints and
      # does NOT recompile here (no "Compiling …"). The env block must stay
      # byte-identical to the build step; RUSTFLAGS, the one that matters most, is the
      # job's and identical by construction.
      - name: Run Rust tests
        run: |
          # Batch-partitioned first: it is the mode under development, so its failures are
          # the ones worth seeing soonest, and it plans rather than executes so it finishes
          # in seconds where the legacy tiers take minutes. It plans real sf1 tables,
          # reading row-group metadata off the parquet, so it needs this tier's dataset.
          cargo test -p peacockdb-core --test test_batch_partitioned_plans
          cargo test -p peacockdb-core --test test_plan_serialiser
          cargo test -p peacockdb-core --test test_query_plan
          cargo test -p peacockdb-core --test test_cpu_full_table
          # Named-not-globbed, so these four were invisible to CI until the
          # test_ci_coverage meta-test surfaced them. They need the dataset + the
          # linked executor, so they belong in this tier rather than the golden one.
          cargo test -p peacockdb-core --test test_cpu_executor_misc
          cargo test -p peacockdb-core --test test_cpu_oom
          cargo test -p peacockdb-core --test test_node_executor
          cargo test -p peacockdb-core --test test_query_plan_misc
          cargo test -p peacockdb-core --test test_cpu_partitioned
          # GpuBatch's own surface, and it belongs in a CPU tier deliberately: the batch
          # is a handle plus a Drop, and the release it calls is null-guarded on the
          # executor, so nothing here needs a device. The GPU half of the ABI is
          # test_gpu_abi, staged for the gpu-tests job.
          cargo test -p peacockdb-core --test test_gpu_batch
          cargo test -p peacockdb-ffi --test test_ffi
          # The FlatBuffer wire-format guard lives HERE, not in the golden-only
          # cost-report tier where it was first wired. It NEEDS the sf1 parquet,
          # because it builds real physical plans before serializing them — the
          # old rationale ("pure text/bytes over committed artifacts, no executor,
          # no dataset, no GPU") was wrong on "no dataset" and would invite someone
          # to move it straight back. It does NOT need a GPU or the linked C++
          # executor (it runs under rust-only), so the parquet CPU tier is its home.
          # It MUST run in CI: the C++ side consumes these bytes, so a write-order
          # shift that only went red locally would reach master green.
          # See tests/test_plan_bytes.rs and goldens/plan_bytes.sha256.
          cargo test --features rust-only -p peacockdb-core --test test_plan_bytes
          # The inline #[cfg(test)] modules: config, gpu_rule, resident, and the
          # batch_partitioned planner, which is 101 of the 110. Every other cargo
          # invocation in this file passes --test, which selects integration targets
          # ONLY — so before this line the lib unit tests ran locally and
          # never in CI. test_ci_coverage asserts this line exists.
          cargo test --features rust-only -p peacockdb-core --lib
          # The executor contract both engines owe, from one table: this runs its rows on
          # the CPU backend and the gpu-tests job runs the same rows on a device. Neither
          # half proves the contract alone, which is why the table is shared rather than
          # copied. Synthetic data written by the test, so no dataset and no device.
          cargo test --features rust-only -p peacockdb-core --test test_cpu_executors
          # SQL in, rows out: every query planned and run at all five modes against
          # DataFusion on the same SQL, and eleven of them at injected layouts no
          # planner would emit — a rebatcher at an interior edge, a drained lane,
          # zero-row batches, a degenerate hash. Needs sf1, generated above; no device.
          cargo test --features rust-only -p peacockdb-core --test test_cpu_batch_partitioned
          # The corpus on the same path: every enabled query at every mode its line
          # declares, answers against DataFusion. Needs sf1, so it lives here and not
          # in the golden-only tier.
          cargo test --features rust-only -p peacockdb-core --test test_cpu_bp_corpus
        env:
          # The pair's own two only; CMAKE_GENERATOR and RUSTFLAGS come from the job.
          LD_LIBRARY_PATH: /opt/conda/lib
          CUDF_ROOT: /opt/conda

  # Standalone build job for the shad-gpu artifact — runs in parallel with dataset-matrix
  # so gpu-tests can start as soon as the build is done, without waiting for the
  # CPU tests + Rust tests to finish.
  cpp-build-2502:
    name: CI Pipeline (build 25.02 for GPU)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: rapidsai/base:25.02-cuda12.0-py3.12
    # Same container sh-not-bash default as dataset-matrix above.
    defaults:
      run:
        shell: bash

    steps:
      - name: Install git
        run: conda install -y -n base -c conda-forge git curl

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/cpp-build
        with:
          cudf: "25.02"

      - name: Bundle Arrow/Parquet runtime libraries
        run: |
          mkdir -p cpp/install/lib
          cp -P /opt/conda/lib/libarrow.so* cpp/install/lib/
          cp -P /opt/conda/lib/libparquet.so* cpp/install/lib/
          cp -P /opt/conda/lib/libarrow_acero.so* cpp/install/lib/ 2>/dev/null || true
          cp -P /opt/conda/lib/libarrow_dataset.so* cpp/install/lib/ 2>/dev/null || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the Rust dep tree for the GPU test-binary build. Own shared-key: this
      # job builds a different target set (test_gpu_executor/test_gpu_node) than
      # dataset-matrix and runs in PARALLEL with it, so a shared key would only invite
      # same-run save contention for no same-run gain. It uses the same
      # RUSTFLAGS=-C debuginfo=0, so it warm-restores its own opt-3 deps.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-gpu-build

      - name: Build and stage rust GPU test binaries
        run: |
          mkdir -p cpp/install/rust-tests
          # The GPU targets, one line each; build-test.md's test table is the detail.
          # test_gpu_full_table / test_gpu_partitioned = the per-query GPU verify, split by
          #   execution mode: each asserts the per-node cost tree against the matching
          #   .cpu.txt golden AND the final result, which catches an intermediate divergence
          #   a whole-result check misses. Staging one alone retires an execution mode.
          # test_inc2_conformance = GPU vs comet Spark-murmur3 partition ids, bit-exact.
          # test_gpu_abi = the batch-partitioned ABI's three per-call symbols on a device;
          #   its companion test_gpu_batch needs no device and runs in dataset-matrix instead.
          # test_gpu_recipe_walk = a recipe plan driven by hand, DataFusion as the oracle.
          # test_gpu_executors = the exec executors, each handed its recipe and one batch.
          # test_node_timing = the per-node TIMING method itself: that the events mode does
          #   not slow the query it measures, and that its CUDA events bracket device work
          #   rather than the host prologue. Every number under testdata/benchmark-results/
          #   assumes both; nothing else checks either.
          # One line on purpose: the coverage guard reads the array below with a single
          # `lines().find`, so a continuation hides every target after the backslash.
          for t in test_gpu_full_table test_gpu_partitioned test_inc2_conformance test_gpu_abi test_gpu_recipe_walk test_gpu_executors test_gpu_bp_corpus test_node_timing; do
            exec_path=$(cargo test --no-run -p peacockdb-core --test "$t" \
                --message-format=json \
              | python3 -c '
          import json, sys
          name = sys.argv[1]
          for line in sys.stdin:
              try: m = json.loads(line)
              except ValueError: continue
              if m.get("executable") and (m.get("target") or {}).get("name") == name:
                  print(m["executable"]); break
          ' "$t")
            if [ -z "$exec_path" ] || [ ! -f "$exec_path" ]; then
              echo "ERROR: failed to locate built binary for $t"; exit 1
            fi
            cp -f "$exec_path" "cpp/install/rust-tests/$t"
            echo "--- Staged: $(ls -lh cpp/install/rust-tests/$t)"
          done
        env:
          CMAKE_GENERATOR: Ninja
          LD_LIBRARY_PATH: /opt/conda/lib
          CUDF_ROOT: /opt/conda
          # Same as the dataset-matrix job: without this, linking the GPU test binaries
          # (full DataFusion/Arrow + libpeacock_gpu, now larger with the TPC-DS
          # suite merged in) overflows the container tmpfs while lld writes its
          # mmap'd output and crashes with SIGBUS. The failure is at *link* time,
          # so a post-build strip can't help — debug info must not be emitted.
          RUSTFLAGS: "-C debuginfo=0"

      - name: Upload GPU test binaries
        uses: actions/upload-artifact@v4
        with:
          name: cpp-install-25.02
          path: cpp/install/
          retention-days: 1

  gpu-tests:
    name: GPU Tests (remote)
    needs: cpp-build-2502
    runs-on: ubuntu-latest
    # Secrets aren't passed to fork PRs, so this job just fails-fast there.
    env:
      GPU_HOST: info@llm-gpu0h200.velkerr.ru
      REMOTE_DIR: /home/info/peacockdb-ci/run-${{ github.run_id }}-${{ github.run_attempt }}
      # WARNING TO ANYONE ADDING A STEP THAT USES THIS: exporting it poisons the HOST's
      # own coreutils. It puts glibc-2.35 ahead of the system libc, and the GPU host runs
      # glibc 2.31 — so mktemp / tee / grep / cat / rm / readelf all SEGFAULT (exit 139)
      # in any shell where it is exported. Our patched test binaries NEED it; shell
      # utilities must not see it. Use bash BUILTINS (>, read, printf, case) inside such a
      # step, or run the utility with the variable unset. This already cost one red CI run:
      # mktemp segfaulted -> empty log path -> tee segfaulted -> the test binary died on
      # SIGPIPE having produced no output, which looks like a test crash and is not.
      REMOTE_LD_LIBRARY_PATH: /usr/local/cuda-12.5/compat:/home/info/glibc-2.35/lib:/home/info/miniforge3/envs/rapids-cuda-12.2/lib

    steps:
      - uses: actions/checkout@v4

      - name: Download GPU test binaries
        uses: actions/download-artifact@v4
        with:
          name: cpp-install-25.02
          path: cpp/install/

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SHAD_GPU_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust-on-first-use: acceptable for CI since runners are ephemeral.
          cat > ~/.ssh/config <<EOF
          Host gpu
              HostName llm-gpu0h200.velkerr.ru
              User info
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts_ci
          EOF

      - name: Rsync artifacts and testdata to remote
        run: |
          ssh gpu "mkdir -p $REMOTE_DIR/cpp/install $REMOTE_DIR/testdata $REMOTE_DIR/scripts"
          # Fresh binaries — --delete keeps cpp/install/ clean across runs.
          rsync -a --delete cpp/install/ gpu:$REMOTE_DIR/cpp/install/
          # Query SQL + minimal dataset + testdata generator + committed goldens.
          # testdata/goldens carries the *.full_table-tp1-standard.cpu.txt tp1
          # node-by-node goldens (29 tpch + 78 tpcds) that test_gpu_full_table asserts
          # against, plus the *.partitioned-tp8-standard.cpu.txt set for
          # test_gpu_partitioned; without them the node-by-node verify cannot run.
          # cost-registry.csv is a committed fixture the registry test READS (it
          # asserts the CSV against the suite's link-time inventory); without it the
          # test dies on a missing file, which reads as a broken check rather than an
          # unprovisioned host.
          #
          # NOTE this hand-maintained list is the standing trap — every new committed
          # fixture must be remembered in EVERY provisioning path independently, and
          # that has now bitten four times. A sweep of git-tracked testdata files
          # would end the class; kept as a named entry here only to keep this push
          # small and low-risk. See the follow-up.
          rsync -a testdata/tpch-queries testdata/tpcds-queries testdata/tpch.minimal \
            testdata/goldens \
            testdata/tpch-vec-queries \
            testdata/generate_testdata.sh \
            testdata/cost-registry.csv \
            gpu:$REMOTE_DIR/testdata/
          # Ship the updated setup-glibc.sh so its patch_rust_dir step is
          # present on the host (not just the older /home/info/ copy).
          rsync -a scripts/setup-glibc.sh gpu:$REMOTE_DIR/scripts/
          chmod +x cpp/install/bin/* cpp/install/rust-tests/* 2>/dev/null || true
          ssh gpu "chmod +x \
            $REMOTE_DIR/cpp/install/bin/* \
            $REMOTE_DIR/cpp/install/rust-tests/* \
            $REMOTE_DIR/testdata/generate_testdata.sh \
            $REMOTE_DIR/scripts/setup-glibc.sh 2>/dev/null || true"

      - name: Patch binaries for glibc 2.35
        run: ssh gpu "$REMOTE_DIR/scripts/setup-glibc.sh --repo-dir $REMOTE_DIR --patch"

      - name: Generate SF-1 testdata (skips if present)
        run: |
          # PEACOCK_NO_FETCH=1 is set EXPLICITLY because ssh does not inherit the runner's
          # CI/GITHUB_ACTIONS vars — fetch_embeddings.sh's automation guard keys on the
          # environment, and over ssh that environment is the GPU host's, not the runner's.
          # Nothing here invokes fetch today; this keeps the guard honest if that changes.
          ssh gpu "cd $REMOTE_DIR && PEACOCK_NO_FETCH=1 DUCKDB=/home/info/.local/bin/duckdb testdata/generate_testdata.sh --bench tpch"
          ssh gpu "cd $REMOTE_DIR && PEACOCK_NO_FETCH=1 DUCKDB=/home/info/.local/bin/duckdb testdata/generate_testdata.sh --bench tpcds"

      - name: Run GPU tests
        run: |
          ssh gpu bash <<EOF
            # Deliberately no 'set -e': run every test binary even when an
            # earlier one fails (e.g. TPC-H failing must not skip TPC-DS), then
            # fail the step at the end if anything failed. Each binary's pass/fail
            # is OR'd into rc.
            export PEACOCK_TESTDATA_DIR=$REMOTE_DIR/testdata
            export LD_LIBRARY_PATH=$REMOTE_DIR/cpp/install/lib:$REMOTE_LD_LIBRARY_PATH

            rc=0

            # The large sf40 dataset lives at /home/info/peacock-datasets — deliberately
            # OUTSIDE \$REMOTE_DIR, which the cleanup step rm -rf's, and it is read in place:
            # nothing here writes to, regenerates or deletes it.
            #
            # SKIP SEMANTICS ARE SPLIT ON PURPOSE. The test binaries skip (exit 0) when the
            # dataset is absent — right for a dev box that legitimately has no sf40. In CI it
            # is NOT right: on this host sf40 is a permanent precondition of those tests
            # existing at all, and a skip that exits 0 renders GREEN having verified nothing.
            # So CI asserts the precondition itself, and the per-binary zero-tests guard
            # below is the belt-and-braces behind it.
            TPCH_SF40=/home/info/peacock-datasets/testdata/tpch.sf40
            if [ ! -f "\$TPCH_SF40/lineitem.parquet" ]; then
              echo "::error::tpch.sf40 missing on the GPU host (\$TPCH_SF40/lineitem.parquet)."
              echo "         It is a permanent precondition of the TPC-H tests, not a transient skip."
              rc=1
            fi

            # ---------------------------------------------------------------------
            # RUN EVERY SHIPPED C++ TEST BINARY — glob, not a hand-written list.
            #
            # This step used to name peacock_plan_tests explicitly, which meant a new test
            # binary could be built, shipped, glibc-patched and verified on the host and
            # STILL NEVER RUN. That is exactly what happened to peacock_tpchv_tests: the
            # job went green having never executed it. The patcher had already been made
            # capability-based so it picks new binaries up automatically — which made the
            # gap HARDER to see, because the log showed the binary being patched.
            #
            # Note why the per-binary zero-tests guard could not catch it either: that guard
            # inspects one binary's output, and a guard scoped to one binary cannot notice a
            # DIFFERENT binary being absent. Hence the glob plus the ran_any assertion below.
            #
            # The glob is peacock_*_tests, which excludes the vendored flatc that also lives
            # in bin/. A new test target needs no edit here.
            #
            # Superset env: every binary gets every variable it might need. Unused ones are
            # ignored, and that keeps this loop from re-growing per-binary special cases.
            export PEACOCK_TESTDATA_DIR=$REMOTE_DIR/testdata
            export PEACOCK_TPCH_SF40_DIR=\$TPCH_SF40
            export PEACOCK_TPCH_GOLDEN_DIR=$REMOTE_DIR/testdata/goldens/tpch.sf40
            export PEACOCK_TPCH_VEC_PARAMS=$REMOTE_DIR/testdata/tpch-vec-queries/query_params.jsonl

            ran_any=0
            for t in $REMOTE_DIR/cpp/install/bin/peacock_*_tests; do
              [ -x "\$t" ] || continue
              # \${t##*/} not basename: basename is coreutils and segfaults under the
              # glibc-2.35 LD_LIBRARY_PATH exported above.
              tname=\${t##*/}
              echo "==> \$tname"
              tlog=$REMOTE_DIR/\$tname.log
              "\$t" > "\$tlog" 2>&1
              trc=\$?
              [ "\$trc" -eq 0 ] || rc=1
              # echo + scan in one builtin pass (no cat, no grep — see the warning on
              # REMOTE_LD_LIBRARY_PATH above)
              tzero=0
              while IFS= read -r line; do
                printf '%s\n' "\$line"
                case "\$line" in *"[  PASSED  ] 0 tests"*) tzero=1 ;; esac
              done < "\$tlog"
              if [ "\$tzero" -eq 1 ]; then
                echo "::error::\$tname ran 0 tests (all skipped) — nothing was verified"
                rc=1
              fi
              ran_any=\$((ran_any + 1))
            done
            # If the glob matched nothing, every C++ test silently vanished. That must be
            # red, not green — it is the same failure this whole block exists to prevent.
            if [ "\$ran_any" -eq 0 ]; then
              echo "::error::no peacock_*_tests binaries found in $REMOTE_DIR/cpp/install/bin"
              rc=1
            fi
            echo "==> ran \$ran_any C++ test binaries"

            echo "==> rust GPU integration tests"
            # Same zero-test guard the C++ loop above carries, in libtest's wording: a
            # rust binary whose cases all vanished exits 0 and says nothing, so the staging
            # array would go on excusing a target that verifies nothing.
            for t in $REMOTE_DIR/cpp/install/rust-tests/*; do
              [ -x "\$t" ] || continue
              tname=\${t##*/}
              echo "--- \$tname"
              # --test-threads=1: cuDF/RMM share one process-wide pool; running
              # several GPU tests concurrently OOMs the device and poisons the
              # CUDA context, cascading into bad_alloc/cudaErrorIllegalAddress
              # for every later test. Sequential is mandatory.
              tlog=$REMOTE_DIR/\$tname.rust.log
              "\$t" --nocapture --test-threads=1 > "\$tlog" 2>&1 || rc=1
              cat "\$tlog"
              if grep -q "^running 0 tests" "\$tlog"; then
                echo "::error::\$tname ran 0 tests — nothing was verified"
                rc=1
              fi
            done

            exit \$rc
          EOF

      - name: Cleanup remote run directory
        if: always()
        run: ssh -o ConnectTimeout=10 gpu "rm -rf $REMOTE_DIR" || true

  # GPU coverage + cost-ratio report (Task 6). Pure CPU/dry: reads only the
  # committed goldens (.cpu.txt = PeacockDB cost, .duckdb_cost.txt = DuckDB
  # oracle) and the test skip list — no GPU, no verda, no executor build. On a
  # PR it upserts a single comment; on master it publishes to GitHub Pages.
  cost-report:
    name: Cost report (coverage + ratio)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base commit is present for the cost-regression
          # gate's `git show <base.sha>:…` baseline read (default checkout is shallow).
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the Rust dep tree so this job restores the opt-3 deps instead of
      # recompiling the whole DataFusion/Arrow stack (the opt-level bump pushed this
      # job 3m30s -> 15m40s cold). Own shared-key, NOT dataset-matrix's: this job sets no
      # RUSTFLAGS (keeps debug symbols), whereas dataset-matrix builds with -C debuginfo=0,
      # so the dep fingerprints differ — a shared key would fingerprint-miss and
      # rebuild anyway. With its own key it warm-restores its own opt-3 deps, which
      # is what makes the 2nd-run cost-report time drop.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cost-report

      # Guard the extractor + report logic on every PR (before generating), so a
      # broken classifier/normalizer fails CI fast. python3 is preinstalled.
      - name: DuckDB extraction unit tests (Python)
        run: python3 testdata/test_duckdb_cost.py

      # The batch-partitioned execution-model prototype. No project code, so it belongs
      # in this cheap tier next to the extractor tests. The scheduler tests are stdlib
      # only; the operator tests need pandas, and they FAIL rather than skip when it is
      # absent — a skipped operator suite reads exactly like a passing one. Same
      # self-heal shape the dataset-matrix and s3-datasets jobs use for numpy/pyarrow.
      #
      # Enumerated by glob rather than by name, unlike the rust targets above: there is
      # no meta guard over python files, so a hand-written list would rot the way
      # test_ci_coverage exists to prevent.
      - name: Exec-model prototype tests (Python)
        run: |
          set -euo pipefail
          python3 -c "import pandas" 2>/dev/null || pip install --quiet pandas
          shopt -s nullglob
          # These three need the generated sf1 tables, which this job does not have.
          # test_tpch.py's plan shapes run in dataset-matrix; the two corpus files run in
          # exec-model-corpus.yml on manual dispatch. Named rather than pattern-matched,
          # and a missing one is an error, so renaming a file cannot silently drop it from
          # every job.
          elsewhere=(scripts/exec_model/tests/test_tpch.py
                     scripts/exec_model/tests/test_tpch_corpus.py
                     scripts/exec_model/tests/test_tpcds.py)
          for e in "${elsewhere[@]}"; do
            [ -f "$e" ] || { echo "$e is missing; is it still run elsewhere?"; exit 1; }
          done
          files=()
          for f in scripts/exec_model/tests/test_*.py; do
            case " ${elsewhere[*]} " in *" $f "*) ;; *) files+=("$f") ;; esac
          done
          # A vanished glob makes the loop body disappear and the step pass green.
          [ ${#files[@]} -gt 0 ] || { echo "no exec-model test files matched"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            echo "== $f"
            # Run every file before reporting, so one failure does not hide the rest.
            python3 "$f" || status=1
          done
          exit "$status"

      - name: cost-report unit tests (Rust)
        run: cargo test -p cost-report

      # It reads committed workflow text and asserts about CI rather than about the engine,
      # so it is tooling and lives with the tooling — and its whole value is saying EARLY that a
      # target is unwired, which it cannot do from behind a container and a dataset build.
      # Every peacockdb-core integration test target must be NAMED by some workflow
      # step above. CI does not sweep them as a set, so a new tests/test_*.rs is
      # invisible here until someone remembers to add it — which is exactly how
      # test_plan_bytes shipped as a guard that could not go red at the merge gate,
      # and how peacock_tpchv_tests was built+shipped+patched but never run (see the
      # C++ glob note in the gpu-tests job). This asserts the coverage instead.
      - name: Every rust test target is wired into CI
        run: cargo test --features rust-only -p peacockdb-core --test test_ci_coverage

      - name: Generate report
        env:
          # Golden cell links point at the code version the report was generated
          # from: the PR head commit on PRs (GITHUB_SHA is the merge ref there),
          # the pushed commit on master. GITHUB_REPOSITORY is read for the slug.
          REPORT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PAGES_URL: https://asymptote-tech.github.io/peacockdb
        run: |
          mkdir -p report
          GENERATED_AT="$(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M %Z')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            # Pages deploy replaces the WHOLE site, so carry the prior page-per-sha
            # reports + manifest forward from the live site (first deploy: history.tsv
            # 404s and we start empty). Then assemble index.html (latest) + <sha>/ +
            # history.html. --published makes the PR-comment "Full report" link live.
            if curl -sfL --retry 3 "$PAGES_URL/history.tsv" -o report/history.tsv; then
              while IFS=$'\t' read -r sha _; do
                [ -n "$sha" ] || continue
                mkdir -p "report/$sha"
                curl -sfL --retry 3 "$PAGES_URL/$sha/index.html" -o "report/$sha/index.html" \
                  || rmdir "report/$sha" 2>/dev/null || true
              done < report/history.tsv
            fi
            cargo run -p cost-report -- --published \
              --sha "$REPORT_SHA" --generated-at "$GENERATED_AT" \
              --site report --md-legacy "$RUNNER_TEMP/pr_comment.md" \
              --md-bp "$RUNNER_TEMP/pr_comment_bp.md"
          else
            # PR: single standalone report for the artifact-less comment; the page
            # isn't published for this change yet, so no --site / no nav links.
            cargo run -p cost-report -- \
              --sha "$REPORT_SHA" --generated-at "$GENERATED_AT" \
              --html report/index.html --md-legacy "$RUNNER_TEMP/pr_comment.md" \
              --md-bp "$RUNNER_TEMP/pr_comment_bp.md"
          fi

      # PR: upsert exactly one comment, keyed on the hidden sentinel. Restricted
      # to same-repo PRs — fork PRs get a read-only token, so a comment write
      # would fail; the Pages publish on master is the canonical artifact.
      # always(), so a failure here cannot take the cost-regression gate down with it —
      # one oversized body did exactly that, and both widgets went missing for one cause.
      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            // The sentinel is the file's FIRST LINE rather than a copy of the constant:
            // the tables exceed one comment's 65,536-byte body, so there are two files, and
            // a sentinel spelled in both Rust and YAML is a constant that drifts.
            for (const name of ['pr_comment.md', 'pr_comment_bp.md']) {
              const path = process.env.RUNNER_TEMP + '/' + name;
              // always() runs this after a failed generate step too, where the file is absent.
              if (!fs.existsSync(path)) { core.info(`no ${name}; skipping`); continue; }
              const body = fs.readFileSync(path, 'utf8');
              const sentinel = body.split('\n', 1)[0];
              // A derived sentinel needs checking on this side: an empty or leading-newline
              // file makes it '', and `includes('')` is true of EVERY comment — the upsert
              // would then edit whichever came first, a person's or the gate's, and look like
              // a widget that moved rather than one that broke.
              if (!sentinel.startsWith('<!-- peacockdb-')) {
                core.setFailed(`${name}: first line is not a sentinel: ${JSON.stringify(sentinel.slice(0, 40))}`);
                continue;
              }
              core.info(`${name}: ${body.length} bytes, sentinel ${sentinel}`);
              const existing = comments.find(c => c.body && c.body.includes(sentinel));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

      # --- PeacockDB CPU cost-regression gate (PR only) -----------------------
      # Diff this PR's .cost.txt totals against the PR's BASE commit, post a
      # per-query widget, and fail the build on any regression. Split into three
      # steps so the comment is visible even when the gate fails: compute (captures
      # the exit code without failing) → upsert comment (always) → fail iff regression.
      # The push/master path skips all three (no base diff, no PR) and no-ops cleanly.
      # always(), for the same reason its own upsert has it: a failure in the comment step
      # above must not decide whether this widget renders. One oversized body took both.
      - name: Cost-regression gate — compute + render
        id: cost_gate
        if: always() && github.event_name == 'pull_request'
        env:
          # The PR's actual base commit (not master tip), so the diff is PR-vs-base
          # and unaffected by other PRs merged to master meanwhile. Present locally
          # thanks to fetch-depth: 0 above.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          cargo run -q -p cost-report -- --cost-diff --base "$BASE_SHA" \
            --html "$RUNNER_TEMP/cost_diff.html" --md-diff "$RUNNER_TEMP/cost_diff.md"
          rc=$?
          set -e
          # rc is three things and the fail step below says which: 0 clean, 1 regressions
          # found, anything else the binary died. `set +e` made a crash and a regression the
          # same red for an hour when a dead flag panicked here.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "cost-diff exit code: $rc"

      # Upsert the regression widget under its OWN sentinel, independent of the
      # coverage comment. `always()` so a regression (which fails a later step) still
      # shows the table. Same-repo only — fork PRs get a read-only token; the gate
      # itself (fail step below) still runs on forks.
      - name: Cost-regression gate — upsert comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/cost_diff.md';
            if (!fs.existsSync(path)) { core.info('no cost_diff.md (gate did not render); skipping'); return; }
            const body = fs.readFileSync(path, 'utf8');
            const sentinel = '<!-- peacockdb-cost-regression -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(sentinel));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Red ❌ on the PR iff the gate found a regression (cost-report exited nonzero),
      # AFTER the widget has been posted above.
      - name: Cost-regression gate — fail on regression
        if: github.event_name == 'pull_request' && steps.cost_gate.outputs.rc != '0'
        run: |
          if [ "${{ steps.cost_gate.outputs.rc }}" = "1" ]; then
            echo "::error::PeacockDB CPU cost regression detected (see the cost-regression PR comment)."
          else
            echo "::error::cost-diff died with rc=${{ steps.cost_gate.outputs.rc }} — it computed no \
          diff, so this is not a cost result. See the cost-diff step's output."
          fi
          exit 1

      # On master, hand report/ to the deploy-pages job as the Pages artifact.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

  # Publish the report to GitHub Pages (https://asymptote-tech.github.io/peacockdb/).
  # Separate job so the github-pages environment (and its master-only deployment
  # rules) never applies to PR runs.
  deploy-pages:
    name: Deploy cost report to Pages
    needs: cost-report
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One in-flight Pages deployment at a time; don't cancel a running deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Tier B: cheap S3 metadata check for the large datasets (tpch-sf40, tpch-sf200,
  # tpcds-sf200). Pure list/head — no download, no disk — so it runs on the standard
  # runner on every PR + master push. Separate job so an S3 blip doesn't block the CPU/GPU
  # legs. Guards keep it honest without wedging master:
  #   * FORK PRs have no secrets -> the job SKIPS itself (nothing to check with no creds).
  #   * EMPTY bucket -> the script SKIPS that bucket (uploads take hours; empty != broken).
  #   * objects present but missing/zero/size-mismatched -> the script FAILS.
  s3-datasets:
    name: S3 datasets metadata check
    needs: changes
    runs-on: ubuntu-latest
    # No secrets on fork PRs -> skip rather than fail. Mirrors the GPU job's fork guard.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check dataset buckets
        # Endpoint + region are not secret; every aws call must pass the endpoint or it
        # hits real AWS. If the secrets are unset (should not happen given the guard),
        # skip loudly rather than error on missing creds.
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "S3 credentials not present — skipping (fork PR or unconfigured)."
            exit 0
          fi
          # NEW DEPENDENCY: the check now reads parquet FOOTERS over ranged GETs to verify
          # schema/embedding-dims/row-counts, so it needs pyarrow (it previously needed only
          # aws + python3). Same import-or-pip self-heal as the Tier A step.
          # numpy is belt-and-braces: dataset_checks.py imports it lazily (inside the
          # embedding-stats helpers only), so a footer-only run does NOT need it — but a
          # future top-level numpy use here must not turn this job red again.
          python3 -c "import pyarrow, numpy" 2>/dev/null || pip install --quiet pyarrow numpy
          python3 scripts/check_s3_datasets.py \
            --endpoint https://storage.eu-north1.nebius.cloud:443
