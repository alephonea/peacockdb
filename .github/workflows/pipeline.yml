name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:

jobs:
  cpp-cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cudf: "26.02"
            image: rapidsai/base:25.10a-cuda12-py3.12
          - cudf: "25.02"
            image: rapidsai/base:25.02-cuda12.0-py3.12
    name: CI Pipeline (cudf ${{ matrix.cudf }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install git
        if: matrix.cudf == '25.02'
        run: conda install -y -n base -c conda-forge git curl

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/cpp-build
        with:
          cudf: ${{ matrix.cudf }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache ~/.cargo + target/ so the opt-level-3 DataFusion/Arrow dep tree
      # compiles once and restores on warm runs. shared-key (not the default
      # per-job key) makes the two cudf matrix legs (25.02/26.02) share ONE cache:
      # the cudf version only affects the C++ side, which rust-cache doesn't touch,
      # so their Rust deps are byte-identical. Same RUSTFLAGS (-C debuginfo=0) as
      # the build/run steps below, so restored artifacts fingerprint-match.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cudf

      - name: Run CPU tests (CPP)
        run: ctest --test-dir cpp/build -L cpu --output-on-failure

      - name: Generate SF-1 test data
        run: |
          # Pinned: the TPC-DS dsdgen extension's column types drift across
          # DuckDB releases (e.g. INT32 vs INT64 surrogate keys), which would
          # shift row_width and target_batch_size across every plan golden.
          # generate_testdata.sh asserts $(duckdb --version) matches this.
          #
          # Use the official GitHub RELEASE binary (v1.5.4, build 08e34c447b) — the
          # SAME build the committed goldens are generated with on local/verda, so CI's
          # regenerated parquet is byte-identical. (conda-forge's duckdb-cli=1.5.4 was
          # repackaged against icu 78, which conflicts with the base env's mamba pinned
          # to icu 75 -> LibMambaUnsatisfiableError; and a different build risks
          # different parquet bytes vs the goldens.)
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/duckdb.zip').extractall('/tmp/duckdb-bin')"
          chmod +x /tmp/duckdb-bin/duckdb
          export DUCKDB=/tmp/duckdb-bin/duckdb
          "$DUCKDB" --version
          testdata/generate_testdata.sh --bench tpch
          testdata/generate_testdata.sh --bench tpcds

      # Build and run are split into two steps so a compile failure is visibly
      # distinct from a test failure, and build vs run time is legible (the
      # opt-level bump made the build phase much heavier). The two steps MUST
      # share a byte-identical env: cargo's fingerprint includes RUSTFLAGS, so any
      # drift would make the run step silently recompile, defeating the split.
      - name: Build Rust tests
        run: |
          cargo test --no-run -p peacockdb-core --test test_plan_serialiser --test test_query_plan --test test_cpu_executor
          cargo test --no-run -p peacockdb-ffi --test test_ffi
        env:
          CMAKE_GENERATOR: Ninja
          LD_LIBRARY_PATH: /opt/conda/lib
          CUDF_ROOT: /opt/conda
          # Strip debug info from all Rust artifacts. The test binaries link the
          # full DataFusion/Arrow stack plus libpeacock_gpu; with debuginfo the
          # largest one (test_query_plan, with the TPC-DS suite merged in)
          # overflows the container's tmpfs while lld writes its mmap'd output,
          # crashing with SIGBUS. Debug info is dead weight for pass/fail CI.
          RUSTFLAGS: "-C debuginfo=0"

      # Pure run: the targets were already compiled by "Build Rust tests" above
      # with the identical env below, so cargo finds matching fingerprints and
      # does NOT recompile here (no "Compiling …"). The env block must stay
      # byte-identical to the build step — especially RUSTFLAGS.
      - name: Run Rust tests
        run: |
          cargo test -p peacockdb-core --test test_plan_serialiser
          cargo test -p peacockdb-core --test test_query_plan
          cargo test -p peacockdb-core --test test_cpu_executor
          cargo test -p peacockdb-ffi --test test_ffi
        env:
          CMAKE_GENERATOR: Ninja
          LD_LIBRARY_PATH: /opt/conda/lib
          CUDF_ROOT: /opt/conda
          # Strip debug info from all Rust artifacts. The test binaries link the
          # full DataFusion/Arrow stack plus libpeacock_gpu; with debuginfo the
          # largest one (test_query_plan, with the TPC-DS suite merged in)
          # overflows the container's tmpfs while lld writes its mmap'd output,
          # crashing with SIGBUS. Debug info is dead weight for pass/fail CI.
          RUSTFLAGS: "-C debuginfo=0"

  # Standalone build job for the shad-gpu artifact — runs in parallel with cpp-cpu
  # so gpu-tests can start as soon as the build is done, without waiting for the
  # CPU tests + Rust tests to finish.
  cpp-build-2502:
    name: CI Pipeline (build 25.02 for GPU)
    runs-on: ubuntu-latest
    container:
      image: rapidsai/base:25.02-cuda12.0-py3.12

    steps:
      - name: Install git
        run: conda install -y -n base -c conda-forge git curl

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/cpp-build
        with:
          cudf: "25.02"

      - name: Bundle Arrow/Parquet runtime libraries
        run: |
          mkdir -p cpp/install/lib
          cp -P /opt/conda/lib/libarrow.so* cpp/install/lib/
          cp -P /opt/conda/lib/libparquet.so* cpp/install/lib/
          cp -P /opt/conda/lib/libarrow_acero.so* cpp/install/lib/ 2>/dev/null || true
          cp -P /opt/conda/lib/libarrow_dataset.so* cpp/install/lib/ 2>/dev/null || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the Rust dep tree for the GPU test-binary build. Own shared-key: this
      # job builds a different target set (test_gpu_executor/test_gpu_node) than
      # cpp-cpu and runs in PARALLEL with it, so a shared key would only invite
      # same-run save contention for no same-run gain. It uses the same
      # RUSTFLAGS=-C debuginfo=0, so it warm-restores its own opt-3 deps.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-gpu-build

      - name: Build and stage rust GPU test binaries
        run: |
          mkdir -p cpp/install/rust-tests
          # test_gpu = the MERGED per-query GPU verify (Phase 2 C2): one GPU run
          # per query asserts BOTH per-node rows + rows+schema cost vs the H200/tp1
          # *.tp1-mem120gib.cpu.txt goldens AND the final result. The node-by-node
          # half is what catches intermediate divergences a whole-result check
          # misses (e.g. q14's INTERSECT NULL-semantics regression), so it MUST gate.
          for t in test_gpu; do
            exec_path=$(cargo test --no-run -p peacockdb-core --test "$t" \
                --message-format=json \
              | python3 -c '
          import json, sys
          name = sys.argv[1]
          for line in sys.stdin:
              try: m = json.loads(line)
              except ValueError: continue
              if m.get("executable") and (m.get("target") or {}).get("name") == name:
                  print(m["executable"]); break
          ' "$t")
            if [ -z "$exec_path" ] || [ ! -f "$exec_path" ]; then
              echo "ERROR: failed to locate built binary for $t"; exit 1
            fi
            cp -f "$exec_path" "cpp/install/rust-tests/$t"
            echo "--- Staged: $(ls -lh cpp/install/rust-tests/$t)"
          done
        env:
          CMAKE_GENERATOR: Ninja
          LD_LIBRARY_PATH: /opt/conda/lib
          CUDF_ROOT: /opt/conda
          # Same as the cpp-cpu job: without this, linking test_gpu
          # (full DataFusion/Arrow + libpeacock_gpu, now larger with the TPC-DS
          # suite merged in) overflows the container tmpfs while lld writes its
          # mmap'd output and crashes with SIGBUS. The failure is at *link* time,
          # so a post-build strip can't help — debug info must not be emitted.
          RUSTFLAGS: "-C debuginfo=0"

      - name: Upload GPU test binaries
        uses: actions/upload-artifact@v4
        with:
          name: cpp-install-25.02
          path: cpp/install/
          retention-days: 1

  gpu-tests:
    name: GPU Tests (remote)
    needs: cpp-build-2502
    runs-on: ubuntu-latest
    # Secrets aren't passed to fork PRs, so this job just fails-fast there.
    env:
      GPU_HOST: info@llm-gpu0h200.velkerr.ru
      REMOTE_DIR: /home/info/peacockdb-ci/run-${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_LD_LIBRARY_PATH: /usr/local/cuda-12.5/compat:/home/info/glibc-2.35/lib:/home/info/miniforge3/envs/rapids-cuda-12.2/lib

    steps:
      - uses: actions/checkout@v4

      - name: Download GPU test binaries
        uses: actions/download-artifact@v4
        with:
          name: cpp-install-25.02
          path: cpp/install/

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SHAD_GPU_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust-on-first-use: acceptable for CI since runners are ephemeral.
          cat > ~/.ssh/config <<EOF
          Host gpu
              HostName llm-gpu0h200.velkerr.ru
              User info
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts_ci
          EOF

      - name: Rsync artifacts and testdata to remote
        run: |
          ssh gpu "mkdir -p $REMOTE_DIR/cpp/install $REMOTE_DIR/testdata $REMOTE_DIR/scripts"
          # Fresh binaries — --delete keeps cpp/install/ clean across runs.
          rsync -a --delete cpp/install/ gpu:$REMOTE_DIR/cpp/install/
          # Query SQL + minimal dataset + testdata generator + committed goldens.
          # testdata/goldens carries the *.tp1-mem120gib.cpu.txt H200/tp1 node-by-node
          # goldens (29 tpch + 78 tpcds) that test_gpu asserts against; without
          # them the node-by-node verify cannot run.
          rsync -a testdata/tpch-queries testdata/tpcds-queries testdata/tpch.minimal \
            testdata/goldens \
            testdata/generate_testdata.sh \
            gpu:$REMOTE_DIR/testdata/
          # Ship the updated setup-glibc.sh so its patch_rust_dir step is
          # present on the host (not just the older /home/info/ copy).
          rsync -a scripts/setup-glibc.sh gpu:$REMOTE_DIR/scripts/
          chmod +x cpp/install/bin/* cpp/install/rust-tests/* 2>/dev/null || true
          ssh gpu "chmod +x \
            $REMOTE_DIR/cpp/install/bin/* \
            $REMOTE_DIR/cpp/install/rust-tests/* \
            $REMOTE_DIR/testdata/generate_testdata.sh \
            $REMOTE_DIR/scripts/setup-glibc.sh 2>/dev/null || true"

      - name: Patch binaries for glibc 2.35
        run: ssh gpu "$REMOTE_DIR/scripts/setup-glibc.sh --repo-dir $REMOTE_DIR --patch"

      - name: Generate SF-1 testdata (skips if present)
        run: |
          ssh gpu "cd $REMOTE_DIR && DUCKDB=/home/info/.local/bin/duckdb testdata/generate_testdata.sh --bench tpch"
          ssh gpu "cd $REMOTE_DIR && DUCKDB=/home/info/.local/bin/duckdb testdata/generate_testdata.sh --bench tpcds"

      - name: Run GPU tests
        run: |
          ssh gpu bash <<EOF
            # Deliberately no 'set -e': run every test binary even when an
            # earlier one fails (e.g. TPC-H failing must not skip TPC-DS), then
            # fail the step at the end if anything failed. Each binary's pass/fail
            # is OR'd into rc.
            export PEACOCK_TESTDATA_DIR=$REMOTE_DIR/testdata
            export LD_LIBRARY_PATH=$REMOTE_DIR/cpp/install/lib:$REMOTE_LD_LIBRARY_PATH

            rc=0

            echo "==> peacock_plan_tests (C++)"
            $REMOTE_DIR/cpp/install/bin/peacock_plan_tests || rc=1

            echo "==> rust GPU integration tests"
            for t in $REMOTE_DIR/cpp/install/rust-tests/*; do
              [ -x "\$t" ] || continue
              echo "--- \$(basename \$t)"
              # --test-threads=1: cuDF/RMM share one process-wide pool; running
              # several GPU tests concurrently OOMs the device and poisons the
              # CUDA context, cascading into bad_alloc/cudaErrorIllegalAddress
              # for every later test. Sequential is mandatory.
              "\$t" --nocapture --test-threads=1 || rc=1
            done

            exit \$rc
          EOF

      - name: Cleanup remote run directory
        if: always()
        run: ssh -o ConnectTimeout=10 gpu "rm -rf $REMOTE_DIR" || true

  # GPU coverage + cost-ratio report (Task 6). Pure CPU/dry: reads only the
  # committed goldens (.cpu.txt = PeacockDB cost, .duckdb_cost.txt = DuckDB
  # oracle) and the test skip list — no GPU, no verda, no executor build. On a
  # PR it upserts a single comment; on master it publishes to GitHub Pages.
  cost-report:
    name: Cost report (coverage + ratio)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base commit is present for the cost-regression
          # gate's `git show <base.sha>:…` baseline read (default checkout is shallow).
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the Rust dep tree so this job restores the opt-3 deps instead of
      # recompiling the whole DataFusion/Arrow stack (the opt-level bump pushed this
      # job 3m30s -> 15m40s cold). Own shared-key, NOT cpp-cpu's: this job sets no
      # RUSTFLAGS (keeps debug symbols), whereas cpp-cpu builds with -C debuginfo=0,
      # so the dep fingerprints differ — a shared key would fingerprint-miss and
      # rebuild anyway. With its own key it warm-restores its own opt-3 deps, which
      # is what makes the 2nd-run cost-report time drop.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cost-report

      # Guard the extractor + report logic on every PR (before generating), so a
      # broken classifier/normalizer fails CI fast. python3 is preinstalled.
      - name: DuckDB extraction unit tests (Python)
        run: python3 testdata/test_duckdb_cost.py

      - name: cost-report unit tests (Rust)
        run: cargo test -p cost-report

      # Verify every committed .cost.txt exactly matches regeneration from its
      # sibling .cpu.txt plan golden (full-file, not just the total), and the
      # cost-model unit test. Pure text over committed goldens — no executor, no
      # dataset, no GPU — so it stays in this cheap golden-only tier.
      - name: Cost goldens match plan-golden regeneration (Rust)
        run: cargo test --features rust-only -p peacockdb-core --test test_cost_model

      - name: Generate report
        env:
          # Golden cell links point at the code version the report was generated
          # from: the PR head commit on PRs (GITHUB_SHA is the merge ref there),
          # the pushed commit on master. GITHUB_REPOSITORY is read for the slug.
          REPORT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PAGES_URL: https://asymptote-tech.github.io/peacockdb
        run: |
          mkdir -p report
          GENERATED_AT="$(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M %Z')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            # Pages deploy replaces the WHOLE site, so carry the prior page-per-sha
            # reports + manifest forward from the live site (first deploy: history.tsv
            # 404s and we start empty). Then assemble index.html (latest) + <sha>/ +
            # history.html. --published makes the PR-comment "Full report" link live.
            if curl -sfL --retry 3 "$PAGES_URL/history.tsv" -o report/history.tsv; then
              while IFS=$'\t' read -r sha _; do
                [ -n "$sha" ] || continue
                mkdir -p "report/$sha"
                curl -sfL --retry 3 "$PAGES_URL/$sha/index.html" -o "report/$sha/index.html" \
                  || rmdir "report/$sha" 2>/dev/null || true
              done < report/history.tsv
            fi
            cargo run -p cost-report -- --published \
              --sha "$REPORT_SHA" --generated-at "$GENERATED_AT" \
              --site report --md "$RUNNER_TEMP/pr_comment.md"
          else
            # PR: single standalone report for the artifact-less comment; the page
            # isn't published for this change yet, so no --site / no nav links.
            cargo run -p cost-report -- \
              --sha "$REPORT_SHA" --generated-at "$GENERATED_AT" \
              --html report/index.html --md "$RUNNER_TEMP/pr_comment.md"
          fi

      # PR: upsert exactly one comment, keyed on the hidden sentinel. Restricted
      # to same-repo PRs — fork PRs get a read-only token, so a comment write
      # would fail; the Pages publish on master is the canonical artifact.
      - name: Upsert PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/pr_comment.md', 'utf8');
            const sentinel = '<!-- peacockdb-cost-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(sentinel));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # --- PeacockDB CPU cost-regression gate (PR only) -----------------------
      # Diff this PR's .cost.txt totals against the PR's BASE commit, post a
      # per-query widget, and fail the build on any regression. Split into three
      # steps so the comment is visible even when the gate fails: compute (captures
      # the exit code without failing) → upsert comment (always) → fail iff regression.
      # The push/master path skips all three (no base diff, no PR) and no-ops cleanly.
      - name: Cost-regression gate — compute + render
        id: cost_gate
        if: github.event_name == 'pull_request'
        env:
          # The PR's actual base commit (not master tip), so the diff is PR-vs-base
          # and unaffected by other PRs merged to master meanwhile. Present locally
          # thanks to fetch-depth: 0 above.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          cargo run -q -p cost-report -- --cost-diff --base "$BASE_SHA" \
            --html "$RUNNER_TEMP/cost_diff.html" --md "$RUNNER_TEMP/cost_diff.md"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "cost-diff exit code: $rc"

      # Upsert the regression widget under its OWN sentinel, independent of the
      # coverage comment. `always()` so a regression (which fails a later step) still
      # shows the table. Same-repo only — fork PRs get a read-only token; the gate
      # itself (fail step below) still runs on forks.
      - name: Cost-regression gate — upsert comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/cost_diff.md';
            if (!fs.existsSync(path)) { core.info('no cost_diff.md (gate did not render); skipping'); return; }
            const body = fs.readFileSync(path, 'utf8');
            const sentinel = '<!-- peacockdb-cost-regression -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(sentinel));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Red ❌ on the PR iff the gate found a regression (cost-report exited nonzero),
      # AFTER the widget has been posted above.
      - name: Cost-regression gate — fail on regression
        if: github.event_name == 'pull_request' && steps.cost_gate.outputs.rc != '0'
        run: |
          echo "::error::PeacockDB CPU cost regression detected (see the cost-regression PR comment)."
          exit 1

      # On master, hand report/ to the deploy-pages job as the Pages artifact.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

  # Publish the report to GitHub Pages (https://asymptote-tech.github.io/peacockdb/).
  # Separate job so the github-pages environment (and its master-only deployment
  # rules) never applies to PR runs.
  deploy-pages:
    name: Deploy cost report to Pages
    needs: cost-report
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One in-flight Pages deployment at a time; don't cancel a running deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
