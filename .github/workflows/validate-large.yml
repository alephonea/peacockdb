name: Validate large datasets

# Tier C: manual-only heavy validation of the large scale factors that live on the
# GPU host (they are far too big for a GitHub runner). SSHes to shad-gpu and runs the
# same scale-safe validators in place against tpch.sf40 / tpch.sf200 / tpcds.sf200,
# then the cheap S3 metadata check. workflow_dispatch ONLY — never on PR/push.
on:
  # ###################################################################################
  # TEMPORARY — REMOVE THIS `push:` BLOCK BEFORE MERGING #106 TO master.
  # It exists for ONE reason: GitHub only registers workflow_dispatch for workflows on
  # the DEFAULT branch, so this workflow cannot be dispatched until it is merged — which
  # would mean merging it unproven. This trigger lets it actually execute on the feature
  # branch first. On master it would SSH to the GPU host on EVERY push; it must not ship.
  # ###################################################################################
  push:
    branches: [ENS-large-datasets]
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Space-separated subset of: tpch.sf40 tpch.sf200 tpcds.sf200'
        required: false
        # DEFAULT = only the datasets that actually EXIST on shad-gpu today. tpch.sf200 is
        # generated-but-postponed, so defaulting to it would make the very first dispatch
        # red. It stays in the allow-list, so dispatching it explicitly still works.
        default: 'tpch.sf40 tpcds.sf200'

jobs:
  validate-large:
    name: Validate large datasets (shad-gpu, in place)
    runs-on: ubuntu-latest
    # Only maintainers with the secret can dispatch; still gate on same-repo for safety.
    if: github.repository == 'asymptote-tech/peacockdb'
    env:
      DATA_ROOT: /home/info/peacock-datasets
      VENV_PY: /home/info/peacock-datasets/venv/bin/python
    steps:
      - uses: actions/checkout@v4

      # Mirror the GPU-tests job in pipeline.yml: same secret (SHAD_GPU_SSH_KEY), same
      # hardcoded host, same 'gpu' alias.
      - name: Setup SSH to shad-gpu
        env:
          SSH_KEY: ${{ secrets.SHAD_GPU_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host gpu
              HostName llm-gpu0h200.velkerr.ru
              User info
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts_ci
          EOF

      - name: Ship validators
        run: |
          ssh gpu "mkdir -p $DATA_ROOT/scripts"
          scp scripts/dataset_checks.py scripts/validate_tpch.py scripts/validate_tpcds.py \
              scripts/check_s3_datasets.py gpu:$DATA_ROOT/scripts/

      - name: Validate in place
        env:
          # Via env (not inlined) so the dispatch input can't break out of the shell;
          # then validated against an allow-list before any use.
          #
          # On a `push` event github.event.inputs.datasets does not exist, so it evaluates
          # to the empty string and the empty-input guard below would (correctly) fail the
          # run. Resolved with an EVENT-CONDITIONAL, not with a default-if-empty fallback:
          # a fallback would also swallow a genuinely-empty DISPATCH and silently defeat
          # that guard. GitHub's &&/|| yield operand values, so push -> the literal, and
          # dispatch -> the raw input INCLUDING empty, which stays fatal.
          # TEMPORARY: revert to plain `${{ github.event.inputs.datasets }}` when the
          # push: trigger above is removed.
          DATASETS: ${{ github.event_name == 'push' && 'tpch.sf40 tpcds.sf200' || github.event.inputs.datasets }}
        run: |
          set -e
          ALLOWED="tpch.sf40 tpch.sf200 tpcds.sf200"
          # EMPTY input -> RED, never green. A cleared datasets box would otherwise run the
          # loop zero times and report success, and "green" is what someone will cite as
          # evidence the datasets are fine.
          if [ -z "$(printf '%s' "$DATASETS" | tr -d '[:space:]')" ]; then
            echo "error: 'datasets' input is empty; choose from: $ALLOWED"; exit 1
          fi
          validated=0
          for ds in $DATASETS; do
            case " $ALLOWED " in
              *" $ds "*) : ;;
              *) echo "error: '$ds' not in allow-list ($ALLOWED)"; exit 1 ;;
            esac
            bench=${ds%%.*}; sf=${ds#*.sf}
            # ABSENT dataset -> SKIP, not FAIL. Same semantics as Tier B's absent-manifest
            # skip: a dataset that hasn't been generated yet is not a broken dataset, and
            # generation takes hours. Only a dataset that IS there and is WRONG goes red.
            # Distinguish "absent" (test -d -> 1) from "ssh broke" (255 etc). An
            # unreachable host must NOT masquerade as an absent dataset and skip green.
            ssh gpu "test -d $DATA_ROOT/testdata/$ds" && rc=0 || rc=$?
            if [ "$rc" = 1 ]; then
              echo "SKIP $ds — $DATA_ROOT/testdata/$ds absent on shad-gpu (not generated yet)"
              continue
            elif [ "$rc" != 0 ]; then
              echo "error: ssh probe for $ds failed with exit $rc (host unreachable?)"; exit 1
            fi
            echo "::group::validate $ds"
            ssh gpu "bash -lc 'cd $DATA_ROOT && $VENV_PY scripts/validate_${bench}.py --sf $sf'"
            echo "::endgroup::"
            validated=$((validated + 1))
          done
          # Every requested dataset was absent -> nothing was checked. Skips are fine
          # individually, but a run where NOT ONE dataset validated must not be green.
          if [ "$validated" -eq 0 ]; then
            echo "error: no dataset was validated (all requested datasets absent on shad-gpu)"; exit 1
          fi
          echo "validated $validated dataset(s)"

      - name: S3 metadata check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          python3 -m pip install --quiet awscli || true
          # check_s3_datasets.py reads parquet FOOTERS, so it needs pyarrow — a clean
          # ubuntu-latest runner has neither it nor numpy. Same import-or-pip self-heal as
          # the Tier B job in pipeline.yml. (numpy is belt-and-braces: dataset_checks.py
          # imports it lazily, so the footer-only path does not need it today.)
          python3 -c "import pyarrow, numpy" 2>/dev/null || pip install --quiet pyarrow numpy
          python3 scripts/check_s3_datasets.py \
            --endpoint https://storage.eu-north1.nebius.cloud:443
