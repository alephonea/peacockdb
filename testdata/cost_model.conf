# PeacockDB cost model — taxonomy + per-byte multipliers driving the .cost.txt
# goldens. Parsed by tests/common/cost_model.rs; exercised by tests/test_cost_model.rs.
#
# Format, one category per line:  <category>  <multiplier>  [node,node,...]
#   - whitespace-separated; the 3rd field is a comma-separated node-type list (no
#     spaces), omitted for placeholder phases that have no node yet.
#   - '#' starts a comment; blank lines are ignored.
#   - category ORDER here is the line order in every generated .cost.txt.
#
# EVERY Gpu node type that appears in a .cpu.txt must be in exactly one category, for
# both families: the legacy wrappers, which end in `Exec`, and the batch-partitioned
# nodes, which do not. `test_cost_model` reads the second set off the exhaustive match in
# `nodes::node_name` and fails on a kind that has no entry here, so a new node kind cannot
# be entered as it is first seen.
# All real categories are multiplier 1.0 today, so the .cost.txt total
# (Σ multiplier*bytes) is byte-identical to the former peacockdb_cost (Σ output_bytes).
# The trailing three are phase placeholders (multiplier 0.0, always 0 bytes) for
# future instrumentation; they contribute nothing to the total.

storage_read_bytes      1.0  GpuScanExec,GpuLoadParquet
cuda_filter_bytes       1.0  GpuFilterExec,GpuFilter
cuda_hash_join_bytes    1.0  GpuHashJoinExec,GpuJoin
cuda_aggregate_bytes    1.0  GpuAggregateExec,GpuAggregate,GpuAggregateBatches
cuda_sort_bytes         1.0  GpuSortExec,GpuSortPreservingMergeExec,GpuSort,GpuAccumulateBatchesAndSort,GpuMergeSortedPartitions
cuda_join_bytes         1.0  GpuNestedLoopJoinExec,GpuCrossJoinExec,GpuNestedLoopJoin,GpuCrossJoin
cuda_window_bytes       1.0  GpuWindowExec
cuda_limit_bytes        1.0  GpuGlobalLimitExec,GpuLimit
cuda_shuffle_bytes      1.0  GpuRepartitionExec,GpuInterleaveExec,GpuCoalescePartitionsExec,GpuUnionExec,GpuEmitPartitions,GpuMergePartitions,GpuUnion,GpuInterleave
cuda_passthrough_bytes  1.0  GpuCoalesceBatchesExec,GpuProjectExec,GpuProject,GpuCoalesceAllBatches
# The next two are the two directions of the same transfer and their names are the
# same three words reversed. vram_to_ram is the export the unload really performs and
# counts; ram_to_vram is still a placeholder at 0.0. An edit landing on the wrong one
# puts a real category silently at zero, which no total would show.
vram_to_ram_bytes       1.0  GpuUnload
ram_to_vram_bytes       0.0
cuda_decompress_bytes   0.0
cuda_rle_decode_bytes   0.0
